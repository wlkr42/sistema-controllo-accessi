<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Sistema Controllo Accessi</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .reset-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            padding: 40px;
            max-width: 450px;
            width: 100%;
        }
        .logo-section {
            text-align: center;
            margin-bottom: 30px;
        }
        .logo-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 20px;
        }
        .password-strength {
            height: 5px;
            border-radius: 3px;
            margin-top: 10px;
            transition: all 0.3s;
        }
        .strength-weak { background: #dc3545; width: 33%; }
        .strength-medium { background: #ffc107; width: 66%; }
        .strength-strong { background: #28a745; width: 100%; }
        .password-requirements {
            font-size: 0.85rem;
            margin-top: 10px;
        }
        .requirement {
            padding: 3px 0;
        }
        .requirement.valid {
            color: #28a745;
        }
        .requirement.invalid {
            color: #dc3545;
        }
        .btn-reset {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            padding: 12px;
            font-weight: 500;
            border-radius: 8px;
            width: 100%;
            margin-top: 20px;
        }
        .btn-reset:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }
    </style>
</head>
<body>
    <div class="reset-container">
        <div class="logo-section">
            <div class="logo-icon">
                <i class="fas fa-key fa-2x text-white"></i>
            </div>
            <h3>Reset Password</h3>
            <p class="text-muted">Inserisci la tua nuova password</p>
        </div>

        <!-- Reset Form (con token) -->
        <div id="reset-form" style="display: none;">
            <form id="resetPasswordForm">
                <input type="hidden" id="reset-token" value="">
                
                <div class="mb-3">
                    <label class="form-label">Nuova Password</label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="new-password" 
                               placeholder="Inserisci nuova password" required>
                        <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('new-password')">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="password-strength" id="strength-bar"></div>
                    <div class="password-requirements">
                        <div class="requirement" id="req-length">
                            <i class="fas fa-circle-check"></i> Minimo 8 caratteri
                        </div>
                        <div class="requirement" id="req-uppercase">
                            <i class="fas fa-circle-check"></i> Una lettera maiuscola
                        </div>
                        <div class="requirement" id="req-lowercase">
                            <i class="fas fa-circle-check"></i> Una lettera minuscola
                        </div>
                        <div class="requirement" id="req-number">
                            <i class="fas fa-circle-check"></i> Un numero
                        </div>
                        <div class="requirement" id="req-special">
                            <i class="fas fa-circle-check"></i> Un carattere speciale
                        </div>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label">Conferma Password</label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="confirm-password" 
                               placeholder="Conferma nuova password" required>
                        <button class="btn btn-outline-secondary" type="button" onclick="togglePassword('confirm-password')">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="invalid-feedback" id="password-match-error">
                        Le password non coincidono
                    </div>
                </div>

                <button type="submit" class="btn btn-reset">
                    <i class="fas fa-lock me-2"></i>Reset Password
                </button>
            </form>
        </div>

        <!-- Forgot Password Form (senza token) -->
        <div id="forgot-form">
            <form id="forgotPasswordForm">
                <div class="mb-3">
                    <label class="form-label">Username</label>
                    <input type="text" class="form-control" id="forgot-username" 
                           placeholder="Inserisci il tuo username" required>
                </div>
                
                <button type="submit" class="btn btn-reset">
                    <i class="fas fa-envelope me-2"></i>Invia Email Reset
                </button>
            </form>
        </div>

        <!-- Success Message -->
        <div id="success-message" class="alert alert-success mt-3" style="display: none;">
            <i class="fas fa-check-circle me-2"></i>
            <span id="success-text"></span>
        </div>

        <!-- Error Message -->
        <div id="error-message" class="alert alert-danger mt-3" style="display: none;">
            <i class="fas fa-exclamation-circle me-2"></i>
            <span id="error-text"></span>
        </div>

        <div class="text-center mt-4">
            <a href="/login" class="text-decoration-none">
                <i class="fas fa-arrow-left me-2"></i>Torna al Login
            </a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Check if token is present in URL
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        
        if (token) {
            document.getElementById('reset-form').style.display = 'block';
            document.getElementById('forgot-form').style.display = 'none';
            document.getElementById('reset-token').value = token;
        }

        // Toggle password visibility
        function togglePassword(fieldId) {
            const field = document.getElementById(fieldId);
            const type = field.type === 'password' ? 'text' : 'password';
            field.type = type;
        }

        // Check password strength
        document.getElementById('new-password').addEventListener('input', function() {
            const password = this.value;
            checkPasswordStrength(password);
            checkPasswordMatch();
        });

        document.getElementById('confirm-password').addEventListener('input', checkPasswordMatch);

        function checkPasswordStrength(password) {
            const requirements = {
                length: password.length >= 8,
                uppercase: /[A-Z]/.test(password),
                lowercase: /[a-z]/.test(password),
                number: /\d/.test(password),
                special: /[!@#$%^&*(),.?":{}|<>]/.test(password)
            };

            // Update requirements display
            document.getElementById('req-length').className = 'requirement ' + (requirements.length ? 'valid' : 'invalid');
            document.getElementById('req-uppercase').className = 'requirement ' + (requirements.uppercase ? 'valid' : 'invalid');
            document.getElementById('req-lowercase').className = 'requirement ' + (requirements.lowercase ? 'valid' : 'invalid');
            document.getElementById('req-number').className = 'requirement ' + (requirements.number ? 'valid' : 'invalid');
            document.getElementById('req-special').className = 'requirement ' + (requirements.special ? 'valid' : 'invalid');

            // Calculate strength
            const strength = Object.values(requirements).filter(Boolean).length;
            const strengthBar = document.getElementById('strength-bar');
            
            if (strength <= 2) {
                strengthBar.className = 'password-strength strength-weak';
            } else if (strength <= 4) {
                strengthBar.className = 'password-strength strength-medium';
            } else {
                strengthBar.className = 'password-strength strength-strong';
            }
        }

        function checkPasswordMatch() {
            const password = document.getElementById('new-password').value;
            const confirm = document.getElementById('confirm-password').value;
            const error = document.getElementById('password-match-error');
            
            if (confirm && password !== confirm) {
                error.style.display = 'block';
                document.getElementById('confirm-password').classList.add('is-invalid');
            } else {
                error.style.display = 'none';
                document.getElementById('confirm-password').classList.remove('is-invalid');
            }
        }

        // Handle reset form submission
        document.getElementById('resetPasswordForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const token = document.getElementById('reset-token').value;
            const newPassword = document.getElementById('new-password').value;
            const confirmPassword = document.getElementById('confirm-password').value;
            
            if (newPassword !== confirmPassword) {
                showError('Le password non coincidono');
                return;
            }

            try {
                const response = await fetch('/api/password/reset', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        token: token,
                        new_password: newPassword,
                        confirm_password: confirmPassword
                    })
                });

                const data = await response.json();
                
                if (data.success) {
                    showSuccess('Password resettata con successo! Reindirizzamento al login...');
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 3000);
                } else {
                    showError(data.error || 'Errore durante il reset');
                }
            } catch (error) {
                showError('Errore di connessione');
            }
        });

        // Handle forgot password form submission
        document.getElementById('forgotPasswordForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const username = document.getElementById('forgot-username').value;
            
            try {
                const response = await fetch('/api/password/forgot', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username: username})
                });

                const data = await response.json();
                
                if (data.success) {
                    showSuccess(data.message);
                    
                    // Se c'è un debug token (email non configurata), mostralo
                    if (data.debug_token) {
                        setTimeout(() => {
                            showSuccess(`Token di reset (solo debug): ${data.debug_token}`);
                        }, 1000);
                    }
                } else {
                    showError(data.error || 'Errore durante la richiesta');
                }
            } catch (error) {
                showError('Errore di connessione');
            }
        });

        function showSuccess(message) {
            document.getElementById('success-text').textContent = message;
            document.getElementById('success-message').style.display = 'block';
            document.getElementById('error-message').style.display = 'none';
        }

        function showError(message) {
            document.getElementById('error-text').textContent = message;
            document.getElementById('error-message').style.display = 'block';
            document.getElementById('success-message').style.display = 'none';
        }
    </script>
</body>
</html>
