# Logrotate configuration for Access Control System
# Enterprise 24/7 log management

/opt/access_control/logs/*.log {
    daily
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    create 0644 root root
    sharedscripts
    postrotate
        # Signal the service to reopen log files
        systemctl reload access-control-web 2>/dev/null || true
    endscript
}

# Special handling for critical logs
/opt/access_control/logs/security_audit.log {
    daily
    rotate 90
    compress
    delaycompress
    missingok
    notifempty
    create 0600 root root
}

# Monitor log with more frequent rotation
/opt/access_control/logs/monitor_24_7.log {
    size 100M
    rotate 10
    compress
    delaycompress
    missingok
    notifempty
    create 0644 root root
}